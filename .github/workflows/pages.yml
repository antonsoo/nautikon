name: Pages

# Builds the site and publishes it to the gh-pages branch; GitHub Pages serves that
# branch directly (Settings -> Pages -> "Deploy from a branch": gh-pages, /).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          # cache-dependency-path: web/package-lock.json   # if the app lives in a subdirectory

      - name: Build and check source model
        run: |
          npm ci
          npm run check
          npm run verify:sources
          npm run verify:model

      - name: Publish to gh-pages without rewriting history
        env:
          SITE_DIR: dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/publish-pages.sh
